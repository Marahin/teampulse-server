<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chat Example</title>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
</head>
<body>
    <script type="text/javascript">
      $(document).ready(function() {
        var conn;

        function registerClient(data) {
          if($(".client#" + data.client.name).length == 0) {

            $("body").append(
              "<div id='" + data.client.name +"' class='client'>" + data.client.name +": 0</div>"
            )
          }
        }

        function registerPing(data) {
          if(data.type === "ping"){
            conn.send(JSON.stringify({type: "pong", content: data.content}))

            return
          }

          if(data.type === "ping-diff"){
            $(".client#" + data.client.name).text(data.client.name + ": " + data.content);

            return
          }
        }

        function unregisterClient(data) {
          if(data.type !== "unregister"){
            return
          }

          $(".client#" + data.client.name).text(data.client.name + ": DEAD");
        }

        if (window["WebSocket"]) {
          var urlParams = new URLSearchParams(window.location.search);
          if(document.location.host !== "localhost:3000") {
            conn = new WebSocket("wss://" + document.location.host + "/ws" + "?room=" + urlParams.get("room") + "&name=" + urlParams.get("name"));
          } else {
            conn = new WebSocket("ws://" + document.location.host + "/ws" + "?room=" + urlParams.get("room") + "&name=" + urlParams.get("name"));
          }
          conn.onclose = function (evt) {
            console.log("Connection closed");
          };
          conn.onmessage = function (evt) {

            var messages = evt.data.split('\n');
            for (var i = 0; i < messages.length; i++) {
              parsed = JSON.parse(messages[i])

              console.log(parsed);

              if(parsed.type === "register" || parsed.type === "ping-diff") {
                registerClient(parsed);
              }
              registerPing(parsed);
              unregisterClient(parsed);
            }
          };
        } else {
          alert('Your browser does not support WebSockets.');
        }
      });
    </script>
</body>
</html>
